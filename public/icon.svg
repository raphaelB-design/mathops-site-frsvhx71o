<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background subtle dark circle/square for standalone favicon view if desired, or transparent -->
    <!-- The icon mark itself is composed of:
         Left upright: rounded cap at bottom, connected node at top.
         Let's craft the exact connected graph "M" symbol from MathOps:
         Nodes at (20, 30), (50, 72), (80, 24).
         Lines:
         Left vertical leg: (20, 78) to (20, 30)
         Left diagonal: (20, 30) to (50, 72)
         Right diagonal: (50, 72) to (80, 24)
         Right vertical leg: (80, 24) to (80, 78)
    -->
    <linearGradient id="mathops-grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>
  <!-- Background transparent -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Right leg (dark/navy blue #1D4ED8 or #1E3A8A) -->
    <line x1="80" y1="36" x2="80" y2="78" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" />

    <!-- Left leg (royal blue #3B82F6) -->
    <line x1="20" y1="36" x2="20" y2="78" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" />

    <!-- Left diagonal (royal blue #3B82F6) -->
    <line x1="20" y1="32" x2="50" y2="70" stroke="#3B82F6" stroke-width="12" />

    <!-- Right diagonal (cyan-blue gradient #00D2FF / #38BDF8) -->
    <line x1="50" y1="70" x2="80" y2="28" stroke="#00E5FF" stroke-width="12" />

    <!-- Node 1 (top-left): filled royal blue ring with hollow dark center -->
    <circle cx="20" cy="30" r="11" fill="#3B82F6" />
    <circle cx="20" cy="30" r="5" fill="#0A0F1D" />

    <!-- Node 2 (bottom-middle): filled royal blue ring with hollow dark center -->
    <circle cx="50" cy="70" r="11" fill="#3B82F6" />
    <circle cx="50" cy="70" r="5" fill="#0A0F1D" />

    <!-- Node 3 (top-right): solid luminous cyan circle -->
    <circle cx="80" cy="26" r="11" fill="#00E5FF" />
  </g>
</svg>
