<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Símbolo M - Grafo MathOps para fundo escuro -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Perna direita (azul profundo) -->
    <line x1="80" y1="36" x2="80" y2="78" stroke="#1E40AF" stroke-width="12" stroke-linecap="round" />

    <!-- Perna esquerda (azul royal) -->
    <line x1="20" y1="36" x2="20" y2="78" stroke="#3B82F6" stroke-width="12" stroke-linecap="round" />

    <!-- Diagonal esquerda (azul royal) -->
    <line x1="20" y1="32" x2="50" y2="70" stroke="#3B82F6" stroke-width="12" />

    <!-- Diagonal direita (ciano vibrante) -->
    <line x1="50" y1="70" x2="80" y2="28" stroke="#00E5FF" stroke-width="12" />

    <!-- Nó 1 (topo-esquerdo) -->
    <circle cx="20" cy="30" r="11" fill="#3B82F6" />
    <circle cx="20" cy="30" r="5" fill="#0A0F1D" />

    <!-- Nó 2 (vértice central inferior) -->
    <circle cx="50" cy="70" r="11" fill="#3B82F6" />
    <circle cx="50" cy="70" r="5" fill="#0A0F1D" />

    <!-- Nó 3 (topo-direito ciano brilhante) -->
    <circle cx="80" cy="26" r="11" fill="#00E5FF" />
  </g>
</svg>
