<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <!-- Symbol "M" -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Right leg -->
    <line x1="68" y1="36" x2="68" y2="70" stroke="#1E40AF" stroke-width="9.5" stroke-linecap="round" />
    <!-- Left leg -->
    <line x1="18" y1="36" x2="18" y2="70" stroke="#2563EB" stroke-width="9.5" stroke-linecap="round" />
    <!-- Left diagonal -->
    <line x1="18" y1="30" x2="43" y2="62" stroke="#2563EB" stroke-width="9.5" />
    <!-- Right diagonal -->
    <line x1="43" y1="62" x2="68" y2="26" stroke="#0284C7" stroke-width="9.5" />
    <!-- Nodes -->
    <circle cx="18" cy="28" r="9" fill="#2563EB" />
    <circle cx="18" cy="28" r="4.2" fill="#FFFFFF" />
    <circle cx="43" cy="62" r="9" fill="#2563EB" />
    <circle cx="43" cy="62" r="4.2" fill="#FFFFFF" />
    <circle cx="68" cy="24" r="9" fill="#0284C7" />
  </g>
  <!-- Text: MathOps (for light background: "Math" in dark graphite #0A0F1D, "Ops" in #2563EB) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700">
    <text x="96" y="60" font-size="44" fill="#0A0F1D" letter-spacing="-0.03em">Math<tspan fill="#2563EB">Ops</tspan></text>
  </g>
  <!-- Text: STRATEGY (for light background: slate gray #64748B) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="0.45em">
    <text x="98" y="78">STRATEGY</text>
  </g>
</svg>
