    <script>
      (function () {
        try {
          var search = window.location.search;
          if (!search) return;
          var params = new URLSearchParams(search);
          var cacheKeys = ['v', 'version', '_v', 'cb', 'cache_bust'];
          var changed = false;
          for (var i = 0; i < cacheKeys.length; i++) {
            if (params.has(cacheKeys[i])) {
              params.delete(cacheKeys[i]);
              changed = true;
            }
          }
          if (window.location.pathname === '/' || changed) {
            var rest = params.toString();
            var cleanUrl = window.location.pathname + (rest ? '?' + rest : '') + window.location.hash;
            if (cleanUrl !== window.location.pathname + search + window.location.hash) {
              window.history.replaceState(window.history.state, '', cleanUrl);
            }
          }
        } catch (e) {}
      })();
    </script>
